server:
  port: 8080

spring:
  application:
    name: park-energy-billing
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/park_energy}
    username: ${DB_USER:postgres}
    password: ${DB_PASSWORD:postgres}
  flyway:
    enabled: true
    locations: classpath:db/migration

park:
  timezone: ${PARK_TZ:Asia/Shanghai}

logging:
  level:
    com.park.energy: INFO
